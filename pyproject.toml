[project]
name = "vault-api"
version = "0.1.0"
description = "A production grade REST API for secure data management, built with FastAPI and PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "email-validator>=2.3,<3.0",
    "python-jose[cryptography]>=3.5,<4.0",
    "pwdlib[argon2]>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.13,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
