[project]
name = "vault-api"
version = "0.1.0"
description = "A FastAPI REST API for authenticated secret storage with PostgreSQL, Argon2, JWT, and Fernet encryption."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "email-validator>=2.3,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "cryptography>=50.0.0,<51.0",
    "slowapi>=0.1.9,<1.0",
    "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.13,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
