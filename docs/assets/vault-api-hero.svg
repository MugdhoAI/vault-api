<text x="60" y="252" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">Store Secrets. <tspan fill="#38bdf8">Keep Control.</tspan></text>
<text x="60" y="300" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">A learning-focused secret vault API with secure authentication,</text>
