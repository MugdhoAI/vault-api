name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vault
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Audit installed dependencies
        run: |
          pip install pip-audit
          pip-audit --skip-editable
      - name: Lint
        run: ruff check .
      - name: Validate Docker image
        run: docker build -t vault-api:test .
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run tests
        run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://vault:vault@localhost:5432/vault
          JWT_SECRET: ci-only-secret
          ENCRYPTION_KEY: 7kUGuh_Ii-U9S_GWRTimitnt0VRydFpODz_FPgHB_Qo=
