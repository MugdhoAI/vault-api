name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest tests/test_security.py
        env:
          JWT_SECRET: ci-only-secret
          ENCRYPTION_KEY: 7kUGuh_Ii-U9S_GWRTimitnt0VRydFpODz_FPgHB_Qo=
